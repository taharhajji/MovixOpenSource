<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Chargement</title>
  <style>
    :root { color-scheme: dark; --accent: #6366f1; --accent-soft: #a5b4fc; }
    html, body { height: 100%; margin: 0; background: #07070b; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 18px; position: relative; }
    .mark .planet { position: absolute; inset: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, var(--accent-soft) 35%, #312e81 100%); }
    .mark .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid transparent; border-top-color: var(--accent-soft); border-right-color: var(--accent); transform: rotate(-28deg); animation: spin 1.1s linear infinite; }
    .name { font-size: 30px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    .hint { margin-top: 14px; color: rgba(255,255,255,0.5); font-size: 14px; }
    @keyframes spin { to { transform: rotate(332deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true"><div class="ring"></div><div class="planet"></div></div>
    <div class="name" id="name">Orbit</div>
    <div class="hint">Connexion au meilleur serveur…</div>
  </div>
  <script>
    (function () {
      var name = new URLSearchParams(location.search).get('name');
      if (name) { document.getElementById('name').textContent = name; document.title = name; }
    })();
  </script>
</body>
</html>
