<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Chargement</title>
  <style>
    :root { color-scheme: dark; --ice: #dbe6f6; --ice-soft: #9fb3d1; }
    html, body { height: 100%; margin: 0; background: #141518; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; }
    .logo { width: 132px; height: 132px; border-radius: 29px; display: block; margin: 0 auto 22px; animation: breathe 2.4s ease-in-out infinite; }
    .name { font-size: 26px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ice); }
    .hint { margin-top: 12px; color: rgba(255,255,255,0.5); font-size: 14px; }
    .bar { width: 160px; height: 3px; margin: 18px auto 0; border-radius: 2px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .bar i { display: block; width: 40%; height: 100%; background: var(--ice-soft); border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { box-shadow: 0 0 40px 6px rgba(219,230,246,0.25); } 50% { box-shadow: 0 0 70px 14px rgba(219,230,246,0.45); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="../../build/icon.png" alt="" />
    <div class="name" id="name">MEWFLIX</div>
    <div class="hint">Connexion au meilleur serveur…</div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
  <script>
    (function () {
      var name = new URLSearchParams(location.search).get('name');
      if (name) { document.getElementById('name').textContent = name; document.title = name; }
    })();
  </script>
</body>
</html>
