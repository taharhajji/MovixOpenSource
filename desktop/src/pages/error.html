<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Service injoignable</title>
  <style>
    :root { color-scheme: dark; --accent: #6366f1; }
    html, body { height: 100%; margin: 0; background: #07070b; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
    .card { max-width: 560px; width: 100%; background: #111118; border: 1px solid #22222e; border-radius: 16px; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    h1 span { color: var(--accent); }
    p { color: rgba(255,255,255,0.7); line-height: 1.5; margin: 0 0 16px; }
    code { background: #1c1c26; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    button { cursor: pointer; border: 0; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 600; color: #fff; background: #22222e; }
    button.primary { background: var(--accent); }
    button:hover { filter: brightness(1.15); }
    .meta { margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <h1><span id="name">Orbit</span> ne parvient pas à joindre le service</h1>
    <p id="summary">Aucun serveur n’a répondu. Vérifiez votre connexion, ou essayez un VPN / le DNS <code>1.1.1.1</code> si votre fournisseur d’accès filtre le service.</p>
    <p id="failure" hidden></p>
    <div class="actions">
      <button class="primary" id="retry">Réessayer</button>
      <button id="support">Support</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>
  <script>
    (async function () {
      var bridge = window.__movixDesktop || {};
      var params = new URLSearchParams(location.search);
      var name = params.get('name') || 'Orbit';
      document.getElementById('name').textContent = name;
      document.title = name + ' — service injoignable';

      var status = {};
      try { status = (await bridge.getStatus()) || {}; } catch (e) {}

      var tried = (status.tried || []).length;
      if (tried) {
        document.getElementById('summary').textContent =
          tried + (tried > 1 ? ' serveurs essayés, aucun n’a répondu.' : ' serveur essayé, sans réponse.')
          + ' Vérifiez votre connexion, ou essayez un VPN / le DNS 1.1.1.1 si votre fournisseur d’accès filtre le service.';
      }
      if (status.lastFailure) {
        var failure = document.getElementById('failure');
        failure.hidden = false;
        failure.textContent = 'Dernière erreur : ' + status.lastFailure;
      }
      if (status.forcedSiteUrl) {
        document.getElementById('meta').textContent =
          'Serveur imposé par la configuration (menu ' + name + ' › Ouvrir le dossier de configuration pour le modifier).';
      } else {
        document.getElementById('meta').textContent = name + ' ' + (status.version || '');
      }

      document.getElementById('retry').addEventListener('click', function () {
        this.disabled = true;
        this.textContent = 'Nouvel essai…';
        if (bridge.retry) bridge.retry();
      });
      document.getElementById('support').addEventListener('click', function () {
        if (bridge.openExternal && status.telegramUrl) bridge.openExternal(status.telegramUrl);
      });
    })();
  </script>
</body>
</html>
